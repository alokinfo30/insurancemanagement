<!DOCTYPE html>
{% load static %}
<html lang="en"><head><meta charset="utf-8"><style>
body{margin:0;padding:0;font-family:"Gill Sans",sans-serif} header{position:fixed;background:#22242A;padding:20px;width:100%;z-index:1}.left_area h3{color:#fff;margin:0;text-transform:uppercase;font-size:22px;font-weight:900}.logout_btn{padding:5px;background:#19B3D3;text-decoration:none;float:right;margin-top:-30px;margin-right:40px;border-radius:2px;font-size:15px;font-weight:600;color:#fff}.sidebar{background:#2f323a;margin-top:70px;padding-top:30px;position:fixed;left:0;width:250px;height:100%;z-index:2}.sidebar .profile_image{width:100px;height:100px;border-radius:100px;margin-bottom:10px}.sidebar h4{color:#ccc;margin-top:0}.sidebar a{color:#fff;display:block;width:100%;line-height:60px;text-decoration:none;padding-left:40px;box-sizing:border-box}.sidebar a:hover{background:#19B3D3}.content{margin-left:250px;background-position:center;background-size:cover;min-height:100vh;transition:.5s}#check{display:none}
</style><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.1/css/all.min.css"></head><body>
<input type="checkbox" id="check"><header><label for="check"><i class="fas fa-bars"></i></label><div class="left_area"><h3>Insurance Management</h3></div><div class="right_area"><a href="{% url 'logout' %}" class="logout_btn">Logout</a></div></header>
<div class="sidebar"><center>{% if customer.profile_pic %}<img src="{{ customer.profile_pic.url }}" class="profile_image" alt="Profile picture">{% else %}<img src="{% static 'image/admin.png' %}" class="profile_image" alt="Profile picture">{% endif %}<h4>{{request.user.first_name}}</h4><h6 style="color:white">( Customer )</h6></center><a href="{% url 'customer-dashboard' %}"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a><a href="{% url 'apply-policy' %}"><i class="fab fa-product-hunt"></i><span>Apply Policy</span></a><a href="{% url 'history' %}"><i class="fas fa-history"></i><span>History</span></a><a href="{% url 'ask-question' %}"><i class="fas fa-question-circle"></i><span>Ask Question</span></a><a href="{% url 'question-history' %}"><i class="fas fa-sync-alt"></i><span>Question History</span></a></div>
<div class="content"><br><br><br><br>{% block content %}{% endblock content %}</div>
<script>window.addEventListener('pageshow',function(e){if(e.persisted){window.location.replace("{% url 'customer-dashboard' %}");}});</script></body></html>
